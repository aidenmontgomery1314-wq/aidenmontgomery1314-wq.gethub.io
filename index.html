<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #081229, #35136b);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 55px 20px 30px;
}

h1 {
  font-size: 48px;
  margin: 0;
}

header p {
  color: #c9c9df;
  font-size: 18px;
}

.games {
  width: 90%;
  max-width: 900px;
  margin: 20px auto 60px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

.game {
  display: block;
  padding: 28px 20px;
  border-radius: 18px;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.16);
  color: white;
  text-decoration: none;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.emoji {
  display: block;
  font-size: 38px;
  margin-bottom: 12px;
}

footer {
  text-align: center;
  color: #9d9db5;
  padding: 25px;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>🎮 Game Hub</h1>
  <p>Pick a game or site and have fun.</p>
</header>

<main class="games">

<a class="game" href="https://poxel.io/" target="_blank">
  <span class="emoji">🧱</span>
  Poxel.io
</a>

<a class="game" href="https://www.crazygames.com/t/racing" target="_blank">
  <span class="emoji">🏎️</span>
  Racing Games
</a>

<a class="game" href="https://www.coolmathgames.com/" target="_blank">
  <span class="emoji">🧠</span>
  Coolmath Games
</a>

<a class="game" href="https://www.hoodamath.com/" target="_blank">
  <span class="emoji">🎯</span>
  Hooda Math
</a>

<a class="game" href="https://lichess.org/" target="_blank">
  <span class="emoji">♟️</span>
  Lichess
</a>

<a class="game" href="https://www.tiktok.com/" target="_blank">
  <span class="emoji">📱</span>
  TikTok
</a>

</main>

<footer>
  Game Hub • Choose your next game
</footer>

</body>
</html>
